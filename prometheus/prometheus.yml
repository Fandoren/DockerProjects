global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'calorieCounter'
    metrics_path: '/api/actuator/prometheus'
    scrape_timeout: 10s
    static_configs:
      - targets: ['calorie-counter-app:8081']
